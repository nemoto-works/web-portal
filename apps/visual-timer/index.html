<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14251d">
  <meta name="description" content="残り時間を20分割バーや円で見える化する、Nemoto Worksの無料ビジュアルタイマー。"><title>Visual Timer — Nemoto Works</title>
  <style>
    :root{--paper:#f4efe4;--ink:#14251d;--orange:#e5663d;--line:rgba(20,37,29,.18);--muted:#667169;--white:#fffdf8;font-family:"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid rgba(229,102,61,.45);outline-offset:3px}
    .topbar{height:68px;padding:0 clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;font-weight:800}.mark{width:32px;height:32px;border:1.5px solid;border-radius:50%;display:grid;place-items:center;font:italic 1rem Georgia,serif}.back{color:inherit;text-decoration:none;font-size:.82rem;border-bottom:1px solid}main{min-height:calc(100vh - 68px);padding:clamp(28px,5vw,64px);display:grid;place-items:center}.shell{width:min(1100px,100%)}
    .intro{display:flex;justify-content:space-between;gap:36px;align-items:end;margin-bottom:30px}.eyebrow{margin:0 0 10px;font-size:.68rem;font-weight:800;letter-spacing:.17em}.intro h1{margin:0;font:400 clamp(2.7rem,7vw,5.8rem)/.92 Georgia,"Yu Mincho",serif;letter-spacing:-.05em}.intro p:last-child{max-width:410px;margin:0;line-height:1.8;color:var(--muted)}.panel{background:var(--white);border:1px solid var(--line);box-shadow:0 20px 60px rgba(20,37,29,.08);display:grid;grid-template-columns:minmax(300px,.8fr) minmax(430px,1.2fr);min-height:560px}
    .settings{padding:clamp(24px,4vw,46px);border-right:1px solid var(--line)}.section-label{display:block;margin:0 0 9px;font-size:.66rem;font-weight:800;letter-spacing:.14em;color:var(--muted)}.field{margin-bottom:26px}.segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}.segmented button{min-height:42px;padding:9px;border:1px solid var(--line);background:transparent;color:var(--ink)}.segmented button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.time-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.time-row input{width:100%;padding:16px 8px;border:1px solid var(--line);background:var(--paper);text-align:center;font-size:1.5rem;font-variant-numeric:tabular-nums}.colon{font:2rem Georgia,serif;color:var(--orange)}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.presets button{padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:transparent;font-size:.78rem}
    .repeat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.repeat-grid label{font-size:.72rem;color:var(--muted)}.repeat-grid input{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);background:var(--paper)}.toggles{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem}.toggles label{display:flex;gap:8px;align-items:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:30px}.primary,.secondary{min-height:50px;border:1px solid var(--ink);font-weight:800}.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.secondary{background:transparent;color:var(--ink)}
    .stage{position:relative;overflow:hidden;background:var(--ink);color:var(--paper);padding:clamp(25px,5vw,60px);display:flex;flex-direction:column;justify-content:center;align-items:center}.stage::after{content:"";position:absolute;width:330px;aspect-ratio:1;border:1px solid rgba(244,239,228,.11);border-radius:50%;right:-180px;top:-130px}.stage-top{position:absolute;left:25px;right:25px;top:22px;display:flex;justify-content:space-between;align-items:center;font-size:.69rem;letter-spacing:.14em;color:rgba(244,239,228,.65)}.icon-btn{border:1px solid rgba(244,239,228,.32);background:transparent;color:var(--paper);padding:8px 11px;position:relative;z-index:2}.time{font:400 clamp(5.2rem,13vw,10rem)/.85 Georgia,serif;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:35px 0 42px;position:relative;z-index:1}.time .sep{color:var(--orange)}.visual{width:100%;position:relative;z-index:1}.bars{display:grid;grid-template-columns:repeat(20,1fr);gap:clamp(3px,.55vw,7px);height:92px}.bar{background:rgba(244,239,228,.12);border-radius:2px;transition:background .25s,transform .25s}.bar.on{background:var(--orange)}.bar.current{transform:translateY(-6px)}.circle{display:none;width:min(280px,55vw);aspect-ratio:1;margin:auto;border-radius:50%;background:conic-gradient(var(--orange) var(--angle,360deg),rgba(244,239,228,.12) 0);position:relative}.circle::after{content:"";position:absolute;inset:22%;background:var(--ink);border-radius:50%}.stage.circle-mode .bars{display:none}.stage.circle-mode .circle{display:block}.status{margin:30px 0 0;font-size:.75rem;letter-spacing:.12em;color:rgba(244,239,228,.7)}
    .clock-only .topbar,.clock-only .intro,.clock-only .settings,.clock-only .help{display:none}.clock-only main{padding:0;min-height:100vh}.clock-only .shell,.clock-only .panel{width:100%;min-height:100vh}.clock-only .panel{display:block;border:0}.clock-only .stage{min-height:100vh}.clock-only .stage-top{display:none}.clock-only .time{font-size:clamp(7rem,23vw,16rem)}.clock-only .bars{height:clamp(90px,18vh,180px)}.clock-only .status{display:none}.layout-vertical .visual{max-width:520px}.layout-horizontal.stage{display:grid;grid-template-columns:.75fr 1.25fr;gap:50px}.layout-horizontal .time{margin:0;font-size:clamp(4.4rem,9vw,8rem)}.layout-horizontal .visual{max-width:640px}.layout-horizontal .status{grid-column:1/-1;text-align:center}.clock-only .layout-horizontal .time{font-size:clamp(7rem,15vw,13rem)}.help{margin:18px 0 0;text-align:center;color:var(--muted);font-size:.78rem}
    @media(max-width:800px){.intro{display:block}.intro p:last-child{margin-top:18px}.panel{grid-template-columns:1fr}.settings{border-right:0;border-bottom:1px solid var(--line)}.stage{min-height:520px}.layout-horizontal.stage{display:flex}.time{font-size:clamp(4.7rem,23vw,8rem)}.bars{height:74px}.clock-only .layout-horizontal.stage{display:grid;grid-template-columns:1fr}.clock-only .layout-horizontal .time{font-size:clamp(6rem,25vw,11rem)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="../../"><span class="mark">N</span><span>Nemoto Works</span></a><a class="back" href="../../">ポータルへ戻る</a></header>
  <main><div class="shell"><div class="intro"><div><p class="eyebrow">VISUAL TIMER / FREE TOOL</p><h1>時間を、<br>目でつかむ。</h1></div><p>20分割のバーや円で、残り時間をひと目で確認。使っていないスマホを、シンプルな卓上タイマーにできます。</p></div>
    <div class="panel"><section class="settings" aria-label="タイマー設定">
      <div class="field"><span class="section-label">計測方法</span><div class="segmented" id="mode"><button class="active" data-value="down">カウントダウン</button><button data-value="up">カウントアップ</button><button data-value="repeat">作業＋休憩</button></div></div>
      <div class="field"><span class="section-label">時間（分 : 秒）</span><div class="time-row"><input id="mins" type="number" min="0" max="99" value="25" aria-label="分"><span class="colon">:</span><input id="secs" type="number" min="0" max="59" value="0" aria-label="秒"></div><div class="presets"><button data-minutes="5">5分</button><button data-minutes="10">10分</button><button data-minutes="25">25分</button><button data-minutes="45">45分</button></div></div>
      <div class="field" id="repeat-fields" hidden><span class="section-label">リピート設定</span><div class="repeat-grid"><label>休憩（分）<input id="break-mins" type="number" min="1" max="99" value="5"></label><label>セット数<input id="rounds" type="number" min="1" max="99" value="4"></label></div></div>
      <div class="field"><span class="section-label">表示</span><div class="segmented" id="visual-mode"><button class="active" data-value="bars">20分割バー</button><button data-value="circle">円</button></div><div class="segmented" id="layout-mode" style="margin-top:7px"><button class="active" data-value="vertical">縦レイアウト</button><button data-value="horizontal">横レイアウト</button></div></div>
      <div class="toggles"><label><input id="sound" type="checkbox" checked> アラーム音</label><label><input id="keep-awake" type="checkbox"> 画面をつけたまま</label></div><div class="actions"><button class="primary" id="start">スタート</button><button class="secondary" id="reset">リセット</button><button class="secondary" id="clock">時計専用表示</button><button class="secondary" id="fullscreen">全画面</button></div>
    </section><section class="stage layout-vertical" id="stage" aria-label="タイマー表示"><div class="stage-top"><span id="phase">FOCUS / 01</span><button class="icon-btn" id="mute">音 ON</button></div><div class="time" role="timer"><span id="mm">25</span><span class="sep">:</span><span id="ss">00</span></div><div class="visual"><div class="bars" id="bars" aria-hidden="true"></div><div class="circle" id="circle" aria-hidden="true"></div></div><p class="status" id="status">準備できました</p></section></div><p class="help">時計専用表示では、画面をタップすると設定に戻ります。音声・画面維持はブラウザの対応状況により動作が異なります。</p>
  </div></main>
  <script>
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const bars=$('#bars');for(let i=0;i<20;i++){const bar=document.createElement('span');bar.className='bar on';bars.append(bar)}let mode='down',running=false,timer=null,total=1500,remaining=1500,elapsed=0,endAt=0,round=1,phase='focus',wakeLock=null,audio=null;const clamp=(n,min,max)=>Math.min(max,Math.max(min,Number(n)||0));const configured=()=>clamp($('#mins').value,0,99)*60+clamp($('#secs').value,0,59);const fmt=n=>[String(Math.floor(Math.max(0,n)/60)).padStart(2,'0'),String(Math.max(0,n)%60).padStart(2,'0')];
    function progress(){return mode==='up'?Math.min(1,elapsed/Math.max(total,1)):Math.max(0,remaining/Math.max(total,1))}function render(){const shown=mode==='up'?elapsed:remaining,[m,s]=fmt(Math.floor(shown));$('#mm').textContent=m;$('#ss').textContent=s;const p=progress(),active=Math.ceil(p*20);$$('.bar').forEach((b,i)=>{b.classList.toggle('on',i<active);b.classList.toggle('current',i===active-1&&p>0)});$('#circle').style.setProperty('--angle',`${p*360}deg`);$('#phase').textContent=mode==='repeat'?`${phase==='focus'?'FOCUS':'BREAK'} / ${String(round).padStart(2,'0')}`:mode==='up'?'COUNT UP':'COUNT DOWN';document.title=running?`${m}:${s} — Visual Timer`:'Visual Timer — Nemoto Works'}
    function stop(label){clearInterval(timer);timer=null;running=false;$('#start').textContent=remaining===total||elapsed===0?'スタート':'再開';if(label)$('#status').textContent=label}function reset(){stop();phase='focus';round=1;total=Math.max(1,configured());remaining=total;elapsed=0;$('#start').textContent='スタート';$('#status').textContent='準備できました';render()}function beep(seconds=1){if(!$('#sound').checked)return;try{audio=audio||new AudioContext();const end=audio.currentTime+seconds;for(let t=audio.currentTime;t<end;t+=.35){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=720;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.2)}}catch(e){}}
    function finish(){if(mode==='repeat'){beep(1);if(phase==='focus'){phase='break';total=clamp($('#break-mins').value,1,99)*60}else if(round<clamp($('#rounds').value,1,99)){phase='focus';round++;total=Math.max(1,configured())}else{stop('すべてのセットが完了しました');beep(2);return}remaining=total;endAt=Date.now()+total*1000;$('#status').textContent=phase==='focus'?'集中時間です':'休憩時間です';render()}else{stop('時間になりました');beep(2);render()}}function tick(){if(mode==='up'){elapsed=Math.min(total,Math.floor((Date.now()-(endAt-total*1000))/1000));if(elapsed>=total)finish()}else{remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(remaining<=0)finish()}render()}function start(){if(running){stop('一時停止しています');return}const previousTotal=total;total=Math.max(1,mode==='repeat'&&phase==='break'?clamp($('#break-mins').value,1,99)*60:configured());if(mode==='up'&&elapsed>=total)elapsed=0;if(mode!=='up'&&(remaining<=0||remaining===previousTotal))remaining=total;endAt=Date.now()+(mode==='up'?(total-elapsed):remaining)*1000;running=true;$('#start').textContent='一時停止';$('#status').textContent=phase==='break'?'休憩時間です':'計測しています';timer=setInterval(tick,250);tick()}
    function segmented(id,cb){$$(id+' button').forEach(b=>b.addEventListener('click',()=>{$$(id+' button').forEach(x=>x.classList.remove('active'));b.classList.add('active');cb(b.dataset.value)}))}segmented('#mode',v=>{mode=v;$('#repeat-fields').hidden=v!=='repeat';reset()});segmented('#visual-mode',v=>$('#stage').classList.toggle('circle-mode',v==='circle'));segmented('#layout-mode',v=>{$('#stage').classList.toggle('layout-horizontal',v==='horizontal');$('#stage').classList.toggle('layout-vertical',v==='vertical')});$$('.presets button').forEach(b=>b.onclick=()=>{$('#mins').value=b.dataset.minutes;$('#secs').value=0;reset()});['#mins','#secs','#break-mins','#rounds'].forEach(s=>$(s).addEventListener('change',reset));$('#start').onclick=start;$('#reset').onclick=reset;$('#mute').onclick=()=>{$('#sound').checked=!$('#sound').checked;$('#mute').textContent=$('#sound').checked?'音 ON':'音 OFF'};$('#sound').onchange=()=>$('#mute').textContent=$('#sound').checked?'音 ON':'音 OFF';$('#clock').onclick=()=>document.body.classList.add('clock-only');$('#stage').onclick=()=>{if(document.body.classList.contains('clock-only'))document.body.classList.remove('clock-only')};$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('#keep-awake').onchange=async e=>{if(e.target.checked){try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{$('#keep-awake').checked=false})}catch(err){e.target.checked=false;$('#status').textContent='このブラウザでは画面維持を利用できません'}}else{await wakeLock?.release();wakeLock=null}};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)tick()});render();
  </script>
</body></html>
