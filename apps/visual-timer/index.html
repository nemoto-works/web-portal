<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>見えるタイマー v4</title><style>
:root{font-family:system-ui,sans-serif;background:#101827;color:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:760px;margin:auto}h1{font-size:1.3rem;margin:0 0 14px}.tabs,.buttons,.presets{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit}button{border:1px solid #516078;background:#253248;color:white;border-radius:12px;padding:11px 15px;cursor:pointer}button.active,.primary{background:#ffb23c;color:#18202d;border-color:#ffb23c;font-weight:700}button:disabled{opacity:.45}label{display:inline-flex;align-items:center;gap:6px;margin:5px 10px 5px 0}input[type=number]{width:92px;background:#202c40;color:white;border:1px solid #62728b;border-radius:8px;padding:9px}.panel{background:#1a2536;border-radius:20px;padding:18px;margin:12px 0}.clock{text-align:center;font-size:clamp(64px,16vw,128px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.phase{text-align:center;font-size:1.1rem;min-height:28px;color:#c6d0e0}.bar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin:25px 0 12px}.segment{height:clamp(55px,12vw,110px);border-radius:4px;background:#3a4557}.segment.on{background:#ffb23c}.circle{width:min(68vw,320px);height:min(68vw,320px);border-radius:50%;margin:14px auto;background:conic-gradient(#ffb23c 100%,#3a4557 0);display:grid;place-items:center}.circle:after{content:'';width:74%;height:74%;background:#1a2536;border-radius:50%}.hidden{display:none!important}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.muted{color:#abb7c9;font-size:.86rem}.flash{animation:flash .5s 6}@keyframes flash{50%{opacity:.3}}@media(orientation:landscape){.clock{font-size:clamp(50px,13vh,100px)}.segment{height:16vh}.circle{width:40vh;height:40vh}}

/* Dedicated clock face */
#focus{position:fixed;inset:0;z-index:50;background:#101827;display:none;align-items:center;justify-content:center;padding:3vmin;cursor:pointer;overflow:hidden}
body.focused{overflow:hidden}body.focused #focus{display:flex}
#focusInner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:3vmin}
#focusClock{font-size:clamp(64px,17vmin,220px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1;white-space:nowrap}
#focusBar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:clamp(2px,.45vmin,9px);width:100%}
#focusBar .segment{height:100%;min-height:0;border-radius:clamp(2px,.5vmin,9px)}
#focusCircle{width:min(66vmin,75vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none}
#focusCircle:after{content:'';width:74%;height:74%;background:#101827;border-radius:50%}
#focus.layout-landscape #focusInner{flex-direction:column}
#focus.layout-landscape #focusBar{height:clamp(60px,22vh,230px)}
#focus.layout-portrait #focusInner{flex-direction:column}
#focus.layout-portrait #focusClock{font-size:clamp(70px,19vw,200px)}
#focus.layout-portrait #focusBar{height:clamp(150px,36vh,440px)}
#focus.layout-portrait #focusCircle{width:min(78vw,58vh)}
#focus.circle-layout #focusInner{gap:4vmin}
#focus.circle-layout.layout-landscape #focusInner{flex-direction:row}
#focus.circle-layout.layout-portrait #focusInner{flex-direction:column}
#focus.circle-layout.layout-landscape #focusClock{font-size:clamp(60px,12vw,210px)}
#focus.circle-layout.layout-landscape #focusCircle{width:min(57vh,46vw)}
#focus.circle-layout.layout-portrait #focusClock{font-size:clamp(65px,18vw,200px)}
#focus:focus-visible{outline:3px solid white;outline-offset:-5px}
</style></head><body><main><h1>⏳ 見えるタイマー</h1><div class="tabs"><button id="normal" class="active">通常計測</button><button id="repeat">リピート計測</button><button id="up">カウントアップ</button></div><div class="panel"><div class="phase" id="phase">残り時間</div><div class="clock" id="clock">05:00</div><div id="bar" class="bar"></div><div id="circle" class="circle hidden"></div><div class="muted" id="progress" style="text-align:center">20 / 20 目盛り</div></div><div class="tabs"><button id="barBtn" class="active">▥ 横バー</button><button id="circleBtn">◉ 円グラフ</button></div><div class="panel" id="normalSettings"><div class="presets" id="presets"></div><div class="settings"><label>分 <input id="min" type="number" min="0" max="500" value="5"></label><label>秒 <input id="sec" type="number" min="0" max="50" step="10" value="0"></label><span class="muted">最大500分・10秒単位</span></div></div><div class="panel hidden" id="repeatSettings"><div class="settings"><label>作業（分）<input id="workMin" type="number" min="0" max="500" value="25"></label><label>秒<input id="workSec" type="number" min="0" max="50" step="10" value="0"></label></div><div class="settings"><label>休憩（分）<input id="restMin" type="number" min="0" max="500" value="5"></label><label>秒<input id="restSec" type="number" min="0" max="50" step="10" value="0"></label><label>作業回数<input id="count" type="number" min="1" max="99" value="4"></label></div><p class="muted">1日の作業可能時間枠は最大500分まで設定できます。作業回数が4なら「作業→休憩→作業→休憩→作業→休憩→作業」で終了します。</p></div><div class="buttons"><button class="primary" id="start">▶ スタート</button><button id="reset">↺ リセット</button><button id="full">⛶ 全画面</button><button id="sound">🔔 音あり</button><button id="wake">☀ 画面維持</button><button id="orientation">↔ 横表示</button><button id="focusBtn" class="primary">▣ 時計専用表示</button></div><p class="muted" id="status">スマホで最初にスタートを押すと通知音が使えるようになります。ブラウザや省電力設定によってはバックグラウンドで音が鳴らない場合があります。</p></main><div id="focus" class="layout-landscape" role="button" tabindex="0" aria-label="タップで設定画面に戻る"><div id="focusInner"><div id="focusClock">05:00</div><div id="focusBar"></div><div id="focusCircle" class="hidden"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let orientation='landscape',mode='normal',view='bar',running=false,remaining=300,total=300,elapsed=0,phase='work',round=1,deadline=0,last=0,silent=false,audio=null,wake=null,alarmTimer=null;const max=30000;const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number.isFinite(+v)?Math.floor(+v):a));const val=id=>+$(id).value||0;const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;function duration(m,s){return Math.min(max,clamp(val(m),0,500)*60+clamp(val(s),0,50));}function valid(d){return d>=10&&d<=max&&d%10===0}function work(){return duration('workMin','workSec')}function rest(){return duration('restMin','restSec')}function count(){return clamp(val('count'),1,99)}function setup(){if(mode==='up'){total=max;remaining=0;elapsed=0}else if(mode==='repeat'){total=work();remaining=total;phase='work';round=1}else{total=duration('min','sec');remaining=total}render()}function setMode(m){if(running)return;mode=m;['normal','repeat','up'].forEach(x=>$(x).classList.toggle('active',x===m));$('normalSettings').classList.toggle('hidden',m!=='normal');$('repeatSettings').classList.toggle('hidden',m!=='repeat');setup()}function render(){let t=mode==='up'?elapsed:remaining;$('clock').textContent=format(t);$('focusClock').textContent=format(t);let ratio=mode==='up'?elapsed/max:(total?remaining/total:0);ratio=Math.max(0,Math.min(1,ratio));let n=mode==='up'?Math.min(20,Math.floor(elapsed/(max/20))):Math.min(20,Math.ceil(ratio*20-1e-10));$('bar').innerHTML=Array.from({length:20},(_,i)=>`<div class="segment ${i<n?'on':''}"></div>`).join('');$('focusBar').innerHTML=$('bar').innerHTML;$('circle').style.background=`conic-gradient(#ffb23c ${ratio*100}%,#3a4557 0)`;$('focusCircle').style.background=$('circle').style.background;$('progress').textContent=`${n} / 20 目盛り`;$('phase').textContent=mode==='up'?'経過時間':mode==='repeat'?`${phase==='work'?'作業':'休憩'} ${round} / ${count()}${phase==='work'?' 回目':''}`:'残り時間';$('start').textContent=running?'Ⅱ 一時停止':(last?'▶ 再開':'▶ スタート');['normal','repeat','up'].forEach(x=>$(x).disabled=running)}function initAudio(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function beep(seconds){if(silent)return;initAudio();if(!audio)return;clearTimeout(alarmTimer);const end=performance.now()+seconds*1000;function pulse(){if(silent||performance.now()>end)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}alarmTimer=setTimeout(pulse,300)}pulse()}function flash(){const e=$('clock');e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}function finish(){running=false;last=0;remaining=0;render();flash();beep(10);$('status').textContent='計測が完了しました。'}function advance(){if(mode!=='repeat'){finish();return}if(phase==='work'){if(round>=count()){finish();return}phase='rest';total=rest()}else{phase='work';round++;total=work()}remaining=total;deadline+=total*1000;beep(3);flash()}function tick(){if(!running)return;const now=Date.now();if(mode==='up'){elapsed=Math.min(max,Math.floor((now-last)/1000));if(elapsed>=max)finish()}else{let guard=0;while(running&&now>=deadline&&guard++<201){advance()}if(running)remaining=Math.max(0,Math.ceil((deadline-now)/1000))}render()}function start(){initAudio();if(running){tick();running=false;if(mode==='up')elapsed=Math.min(max,Math.floor((Date.now()-last)/1000));else remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));last=1;render();return}if(mode==='repeat'&&(!valid(work())||!valid(rest()))){alert('作業・休憩時間は10秒〜500分、10秒単位で設定してください。');return}if(mode==='normal'&&!valid(duration('min','sec'))){alert('10秒〜500分、10秒単位で設定してください。');return}if(!last)setup();running=true;if(mode==='up')last=Date.now()-elapsed*1000;else deadline=Date.now()+remaining*1000;render();tick()}function reset(){running=false;last=0;clearTimeout(alarmTimer);setup();$('status').textContent='リセットしました。'}$('start').onclick=start;$('reset').onclick=reset;['normal','repeat','up'].forEach(x=>$(x).onclick=()=>setMode(x));['min','sec','workMin','workSec','restMin','restSec','count'].forEach(id=>$(id).addEventListener('change',()=>{if(!running){last=0;setup()}}));[5,10,15,25,30,60,480,500].forEach(n=>{let b=document.createElement('button');b.textContent=n+'分';b.onclick=()=>{if(running)return;$('min').value=n;$('sec').value=0;last=0;setup()};$('presets').appendChild(b)});function syncFocus(){const f=$('focus');f.classList.toggle('layout-landscape',orientation==='landscape');f.classList.toggle('layout-portrait',orientation==='portrait');f.classList.toggle('circle-layout',view==='circle');$('focusBar').classList.toggle('hidden',view!=='bar');$('focusCircle').classList.toggle('hidden',view!=='circle');$('orientation').textContent=orientation==='landscape'?'↔ 横表示':'↕ 縦表示'}$('orientation').onclick=()=>{orientation=orientation==='landscape'?'portrait':'landscape';syncFocus()};function exitFocus(){document.body.classList.remove('focused')}function enterFocus(){syncFocus();document.body.classList.add('focused')} $('focusBtn').onclick=enterFocus;$('focus').onclick=exitFocus;$('focus').onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'||e.key===' '){e.preventDefault();exitFocus()}};$('barBtn').onclick=()=>{view='bar';$('bar').classList.remove('hidden');$('circle').classList.add('hidden');$('barBtn').classList.add('active');$('circleBtn').classList.remove('active');syncFocus()};$('circleBtn').onclick=()=>{view='circle';$('bar').classList.add('hidden');$('circle').classList.remove('hidden');$('barBtn').classList.remove('active');$('circleBtn').classList.add('active')};$('sound').onclick=()=>{silent=!silent;$('sound').textContent=silent?'🔕 消音':'🔔 音あり';if(silent)clearTimeout(alarmTimer)};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};$('wake').onclick=async()=>{if(wake){await wake.release();wake=null;$('wake').textContent='☀ 画面維持';return}try{wake=await navigator.wakeLock.request('screen');$('wake').textContent='☀ 維持中';wake.addEventListener('release',()=>{$('wake').textContent='☀ 画面維持';wake=null})}catch(e){$('status').textContent='画面維持はHTTPSまたは対応ブラウザで利用できます。スマホの画面消灯設定も確認してください。'}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,200);setup();syncFocus()})();
</script></body></html>
