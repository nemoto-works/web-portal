name: History Neighbors smoke test
on:
  pull_request:
    paths:
      - 'apps/history-neighbors/**'
      - '.github/workflows/history-neighbors-test.yml'
  push:
    paths:
      - 'apps/history-neighbors/**'
      - '.github/workflows/history-neighbors-test.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s apps/history-neighbors -p 'test_*.py' -v
