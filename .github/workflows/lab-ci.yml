name: LAB CI

on:
  pull_request:
    paths:
      - 'lab/**'
      - 'scripts/validate-lab.mjs'
      - 'AGENTS.md'
      - '.github/ISSUE_TEMPLATE/lab-app.yml'
      - '.github/workflows/lab-*.yml'
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'scripts/validate-lab.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-lab.mjs
