<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>段取りチェッカー | Nemoto Works LAB</title><style>body{font-family:system-ui,sans-serif;background:#f6f7fa;color:#192334;margin:0}main{max-width:620px;margin:auto;padding:20px}section{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #18233812}h1{font-size:1.6rem}button,input,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #ccd2db}button{background:#244c9b;color:white;border:0;cursor:pointer}button.secondary{background:#e7edf7;color:#193a77}textarea{box-sizing:border-box;width:100%;height:140px}input[type=time]{max-width:130px}li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}li span{flex:1}small{color:#697386}.clock{font-size:2.5rem;font-weight:750;font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.done{text-decoration:line-through;color:#888}.warn{color:#bd4b19}label{display:inline-flex;gap:8px;align-items:center}</style></head><body><main><h1>段取りチェッカー <small>LAB v0.1</small></h1><p>やることを入力して、締切から逆算。完了するたびに段取りを更新。</p><section><label>出発・締切 <input type="time" id="deadline" value="11:03"></label><p><textarea id="raw" placeholder="ご飯 20分&#10;洗濯 40分&#10;お皿洗い 10分&#10;水筒 5分"></textarea></p><div class="row"><button id="import">一括登録</button><button class="secondary" id="ai">AI用指示をコピー</button></div><p><small>「タスク名 10分」の形式、または tasks 配列を含むJSONに対応。</small></p></section><section><small>締切まで</small><div class="clock" id="clock">--:--:--</div><p id="status"></p><div class="row"><input id="newname" placeholder="追加タスク"><input id="newmin" type="number" min="1" value="5" style="width:65px"><button id="add">追加</button></div></section><section><h2>段取り <small id="count"></small></h2><p><small>チェックで完了。上下ボタンで順番変更（長押し操作は今後対応）。</small></p><ol id="tasks"></ol><button class="secondary" id="clear">すべてクリア</button></section></main><script>
const $=id=>document.getElementById(id),KEY='nw-dandori-v01';let tasks=[],deadline='11:03';try{let s=JSON.parse(localStorage.getItem(KEY));tasks=s.tasks||[];deadline=s.deadline||deadline}catch(e){}$('deadline').value=deadline;
function save(){localStorage.setItem(KEY,JSON.stringify({tasks,deadline:$('deadline').value}))}
function fmt(n){n=Math.max(0,Math.floor(n));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}
function target(){let [h,m]=$('deadline').value.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d}
function tick(){let diff=Math.floor((target()-new Date())/1000);$('clock').textContent=(diff<0?'-':'')+fmt(Math.abs(diff));let mins=tasks.filter(t=>!t.done).reduce((a,t)=>a+t.minutes,0),slack=Math.floor(diff/60)-mins;$('status').textContent=diff<0?'締切を過ぎました':slack<0?'予定より '+(-slack)+' 分不足しています':'作業見込み '+mins+' 分・余裕 '+slack+' 分';$('status').className=slack<0?'warn':''}
function render(){let el=$('tasks');el.innerHTML='';tasks.forEach((t,i)=>{let li=document.createElement('li'),c=document.createElement('input');c.type='checkbox';c.checked=!!t.done;c.onchange=()=>{t.done=c.checked;save();render()};let name=document.createElement('span');name.textContent=t.name+'（'+t.minutes+'分）';if(t.done)name.className='done';li.append(c,name);for(let [label,offset] of [['↑',-1],['↓',1]]){let b=document.createElement('button');b.className='secondary';b.textContent=label;b.disabled=i+offset<0||i+offset>=tasks.length;b.onclick=()=>{[tasks[i],tasks[i+offset]]=[tasks[i+offset],tasks[i]];save();render()};li.append(b)}el.append(li)});$('count').textContent=tasks.filter(t=>t.done).length+'/'+tasks.length+' 完了';tick()}
$('deadline').onchange=()=>{save();tick()};
$('import').onclick=()=>{let s=$('raw').value.trim();if(!s)return;let a=[];try{let j=JSON.parse(s);a=(Array.isArray(j)?j:j.tasks).map(t=>({name:String(t.name),minutes:Number(t.minutes||t.min||5),done:false}));if(j.deadline)$('deadline').value=j.deadline}catch(e){a=s.split(/\n/).map(x=>{let m=x.trim().match(/^(.+?)\s*[：:]?\s*(\d+)\s*分?$/);return m?{name:m[1].trim(),minutes:+m[2],done:false}:null}).filter(Boolean)}if(!a.length){alert('タスクを読み取れませんでした');return}tasks.push(...a);$('raw').value='';save();render()};
$('add').onclick=()=>{let name=$('newname').value.trim(),minutes=Number($('newmin').value);if(!name||minutes<=0)return;tasks.push({name,minutes,done:false});$('newname').value='';save();render()};
$('clear').onclick=()=>{if(confirm('すべてのタスクを削除しますか？')){tasks=[];save();render()}};
$('ai').onclick=()=>{let prompt='以下の雑なタスクメモを段取りチェッカー用JSONにしてください。形式は {"deadline":"HH:MM","tasks":[{"name":"作業名","minutes":10}]}。説明文やコードフェンスは不要です。締切・作業時間を維持してください。';navigator.clipboard.writeText(prompt).then(()=>alert('指示文をコピーしました')).catch(()=>alert(prompt))};
render();setInterval(tick,1000);
</script></body></html>
