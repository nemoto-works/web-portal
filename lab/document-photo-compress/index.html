<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="書類の写真をまとめて、指定した合計容量以下に圧縮します。">
<title>書類写真の圧縮 — Nemoto Works LAB</title>
<style>
  * { box-sizing: border-box }
  :root { color-scheme: light; font: 100%/1.65 system-ui, sans-serif; color: #14302d; background: #eff5f2 }
  body { margin: 0 }
  main { width: min(100% - 2rem, 34rem); margin: clamp(1.5rem, 7vw, 4.5rem) auto }
  header { margin-bottom: 1.3rem }
  .lab-nav { margin-bottom: 1rem }
  .lab-nav a { color: #095c49; text-underline-offset: .2em }
  h1 { font-size: clamp(1.85rem, 7vw, 2.5rem); line-height: 1.25; margin: 0 0 .55rem }
  h2 { font-size: 1.15rem; margin: 0 0 .6rem }
  p { margin: .35rem 0 0 }
  .muted { color: #455e58 }
  .panel { background: white; border: 1px solid #d7e5df; padding: clamp(1rem, 4vw, 1.5rem); border-radius: 1.25rem; margin-bottom: 1rem }
  label, legend { font-weight: 700 }
  input, select, button { font: inherit }
  input[type=file] { display: block; width: 100%; margin: .55rem 0 0 }
  input::file-selector-button { padding: .55rem .75rem; border: 1px solid #a6c9bc; border-radius: .6rem; background: #f1f8f4; color: inherit; margin-right: .65rem; font: inherit; cursor: pointer }
  fieldset { padding: 0; border: 0; margin: 1.3rem 0 .95rem; min-width: 0 }
  .limits, .custom { display: flex; gap: .5rem; margin-top: .55rem }
  .limits button { flex: 1; padding: .4rem .15rem; border: 1px solid #a6c9bc; border-radius: .6rem; background: white; color: inherit; white-space: nowrap }
  .limits [aria-pressed=true] { border-color: #146251; background: #e0f2ea; color: #064737; font-weight: 700 }
  .custom input, select { min-width: 0; padding: .4rem .6rem; border: 1px solid #a6c9bc; border-radius: .6rem; background: white; color: inherit }
  .custom input { flex: 1 }
  .primary { display: block; width: 100%; padding: .7rem; background: #095c49; color: white; text-align: center; text-decoration: none; border: 0; border-radius: .65rem; font-weight: 700 }
  button, select { cursor: pointer }
  button:disabled { opacity: .5; cursor: default }
  :focus-visible { outline: 3px solid #bd6203; outline-offset: 3px }
  #status:empty { display: none }
  #status[data-error=true] { color: #a12225 }
  #files { list-style: none; padding: 0; margin: .9rem 0 0 }
  #files li { padding: .85rem 0; border-top: 1px solid #d7e5df }
  .file-name { display: block; overflow-wrap: anywhere }
  .file-save { display: inline-block; margin-top: .55rem; color: #095c49; font-weight: 700 }
  details { margin-top: .85rem }
  summary { cursor: pointer }
  img { display: block; width: 100%; height: auto; border: 1px solid #d7e5df; border-radius: .6rem; margin-top: .7rem }
  footer { font-size: .9rem; text-align: center }
</style>
</head>
<body>
<main>
  <nav class="lab-nav" aria-label="Nemoto Works"><a href="../">Nemoto Works LAB</a></nav>
  <header>
    <h1>書類写真の圧縮</h1>
    <p class="muted">1枚でも複数枚でも、提出先の容量制限に合わせて圧縮できます。</p>
  </header>
  <form class="panel" id="form">
    <label for="photo">提出する写真（複数選択可）</label>
    <input id="photo" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple required aria-describedby="selection">
    <p class="muted" id="selection" aria-live="polite">写真を選択してください。</p>
    <fieldset>
      <legend>合計容量の上限</legend>
      <div class="limits" aria-label="容量の候補">
        <button type="button" data-size="500" data-unit="1000" aria-pressed="false">500 KB</button>
        <button type="button" data-size="1" data-unit="1000000" aria-pressed="false">1 MB</button>
        <button type="button" data-size="2" data-unit="1000000" aria-pressed="true">2 MB</button>
        <button type="button" data-size="5" data-unit="1000000" aria-pressed="false">5 MB</button>
      </div>
      <div class="custom">
        <input id="amount" type="number" inputmode="decimal" min="0.001" step="any" value="2" aria-label="上限の数値" required>
        <select id="unit" aria-label="容量の単位">
          <option value="1000">KB</option>
          <option value="1000000" selected>MB</option>
        </select>
      </div>
    </fieldset>
    <button class="primary" id="compress" type="submit" disabled>圧縮する</button>
    <p id="status" role="status"></p>
  </form>
  <section class="panel" id="result" hidden>
    <h2 id="result-title">圧縮できました</h2>
    <p id="sizes"></p>
    <p class="muted">提出前に小さな文字まで読めるか確認してください。</p>
    <ul id="files"></ul>
  </section>
  <footer class="muted">写真は端末のブラウザ内で処理します。</footer>
</main>
<script>
  const form = document.querySelector('#form')
  const photo = document.querySelector('#photo')
  const amount = document.querySelector('#amount')
  const unit = document.querySelector('#unit')
  const compress = document.querySelector('#compress')
  const status = document.querySelector('#status')
  const result = document.querySelector('#result')
  const selection = document.querySelector('#selection')
  const filesList = document.querySelector('#files')
  const originalFormats = new Set(['image/jpeg', 'image/png', 'image/webp'])
  const presets = [...document.querySelectorAll('[data-size]')]
  const outputUrls = []
  let busy = false

  function resetResult() {
    result.hidden = true
    filesList.replaceChildren()
    for (const url of outputUrls.splice(0)) URL.revokeObjectURL(url)
    status.textContent = ''
    status.dataset.error = 'false'
    for (const preset of presets) {
      const selected = Number(preset.dataset.size) === Number(amount.value) && preset.dataset.unit === unit.value
      preset.setAttribute('aria-pressed', selected)
    }
    compress.disabled = busy || !photo.files.length
  }

  for (const preset of presets) {
    preset.addEventListener('click', () => {
      amount.value = preset.dataset.size
      unit.value = preset.dataset.unit
      resetResult()
    })
  }
  photo.addEventListener('change', () => {
    const files = [...photo.files]
    const bytes = files.reduce((sum, file) => sum + file.size, 0)
    selection.textContent = files.length ? files.length + '枚を選択 · 合計 ' + formatSize(bytes) : '写真を選択してください。'
    resetResult()
  })
  amount.addEventListener('input', resetResult)
  unit.addEventListener('change', resetResult)

  function formatSize(bytes) {
    const number = new Intl.NumberFormat('ja-JP')
    if (bytes < 1000) return number.format(bytes) + ' B'
    const divisor = bytes < 1000000 ? 1000 : 1000000
    const displayed = Math.ceil(bytes / divisor * 100) / 100
    return number.format(displayed) + (divisor === 1000 ? ' KB' : ' MB') + '（' + number.format(bytes) + ' B）'
  }

  function encode(canvas, quality) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob)
        else reject(new Error('写真を書き出せませんでした。'))
      }, 'image/jpeg', quality)
    })
  }

  async function shrink(image, limit) {
    const canvas = document.createElement('canvas')
    const context = canvas.getContext('2d', { alpha: false })
    if (!context) throw new Error('このブラウザでは写真を圧縮できません。')
    const { naturalWidth: width, naturalHeight: height } = image
    let scale = Math.min(1, 4096 / Math.max(width, height))
    while (true) {
      canvas.width = Math.max(1, Math.round(width * scale))
      canvas.height = Math.max(1, Math.round(height * scale))
      context.fillStyle = '#fff'
      context.fillRect(0, 0, canvas.width, canvas.height)
      context.drawImage(image, 0, 0, canvas.width, canvas.height)
      const highQuality = await encode(canvas, 0.92)
      if (highQuality.size <= limit) return highQuality
      const baseline = await encode(canvas, 0.58)
      if (baseline.size <= limit) {
        let best = baseline
        let low = 0.58
        let high = 0.92
        for (let step = 0; step < 6; step++) {
          const quality = (low + high) / 2
          const candidate = await encode(canvas, quality)
          if (candidate.size <= limit) {
            low = quality
            best = candidate
          } else {
            high = quality
          }
        }
        return best
      }
      if (Math.max(canvas.width, canvas.height) <= 96) {
        throw new Error('この上限では圧縮できません。容量の上限を上げてください。')
      }
      scale *= Math.max(0.5, Math.min(0.88, Math.sqrt(limit / baseline.size)))
    }
  }

  async function preparePhoto(file, limit) {
    const inputUrl = URL.createObjectURL(file)
    try {
      const image = new Image()
      image.src = inputUrl
      await image.decode().catch(() => {
        throw new Error('写真を開けません。JPEG、PNG、WebPの写真を選んでください。')
      })
      if (file.size <= limit && originalFormats.has(file.type)) return file
      return await shrink(image, limit)
    } finally {
      URL.revokeObjectURL(inputUrl)
    }
  }

  function showPhoto(file, output) {
    const url = URL.createObjectURL(output)
    outputUrls.push(url)

    const row = document.createElement('li')
    const name = document.createElement('strong')
    name.className = 'file-name'
    name.textContent = file.name

    const size = document.createElement('p')
    size.textContent = output === file
      ? formatSize(file.size) + ' · 元の写真'
      : formatSize(file.size) + ' → ' + formatSize(output.size)

    const save = document.createElement('a')
    save.className = 'file-save'
    save.href = url
    save.download = output === file ? file.name : (file.name.replace(/\.[^.]+$/, '') || 'document') + '-compressed.jpg'
    save.textContent = '写真を保存'
    save.setAttribute('aria-label', file.name + 'を保存')

    const details = document.createElement('details')
    const summary = document.createElement('summary')
    summary.textContent = '写真をプレビュー'
    const image = document.createElement('img')
    image.alt = file.name + 'のプレビュー'
    image.loading = 'lazy'
    image.src = url
    details.append(summary, image)

    row.append(name, size, save, details)
    filesList.append(row)
  }

  form.addEventListener('submit', async event => {
    event.preventDefault()
    if (busy) return
    const files = [...photo.files]
    const limit = Math.floor(Number(amount.value) * Number(unit.value))
    if (!files.length) return
    if (!Number.isSafeInteger(limit) || limit < files.length) {
      status.dataset.error = 'true'
      status.textContent = '容量の上限を上げてください。'
      return
    }

    busy = true
    resetResult()
    const controls = [photo, amount, unit, ...presets]
    controls.forEach(control => { control.disabled = true })
    try {
      const ordered = files.map((file, index) => ({ file, index })).sort((a, b) => a.file.size - b.file.size)
      const outputs = []
      let remaining = limit
      for (const [position, { file, index }] of ordered.entries()) {
        status.textContent = '写真を処理しています… ' + (position + 1) + ' / ' + files.length + '枚'
        // Give unused bytes from smaller photos to the photos still to be processed.
        const budget = Math.floor(remaining / (files.length - position))
        try {
          const output = await preparePhoto(file, budget)
          outputs[index] = output
          remaining -= output.size
        } catch (error) {
          throw new Error(file.name + ' — ' + (error instanceof Error ? error.message : '写真を圧縮できませんでした。'))
        }
      }

      const originalTotal = files.reduce((sum, file) => sum + file.size, 0)
      const unchanged = outputs.every((output, index) => output === files[index])
      document.querySelector('#result-title').textContent = unchanged ? '元の写真が上限内です' : '圧縮できました'
      document.querySelector('#sizes').textContent = files.length + '枚の合計 ' + (
        unchanged ? formatSize(originalTotal) : formatSize(originalTotal) + ' → ' + formatSize(limit - remaining)
      )
      files.forEach((file, index) => showPhoto(file, outputs[index]))
      result.hidden = false
      status.textContent = unchanged ? '元の写真をそのまま保存できます。' : '合計が上限以下になりました。'
    } catch (error) {
      status.dataset.error = 'true'
      status.textContent = error instanceof Error ? error.message : '写真を圧縮できませんでした。'
    } finally {
      busy = false
      controls.forEach(control => { control.disabled = false })
      compress.disabled = !photo.files.length
    }
  })
</script>
</body>
</html>
